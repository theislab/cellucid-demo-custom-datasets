<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Cellucid custom dataset examples</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.55;
      }
      body {
        margin: 0 auto;
        max-width: 54rem;
        padding: 2rem 1.25rem 4rem;
      }
      a {
        color: inherit;
      }
      code {
        background: color-mix(in srgb, CanvasText 9%, Canvas);
        border-radius: 0.25rem;
        padding: 0.1rem 0.3rem;
      }
      li + li {
        margin-top: 0.7rem;
      }
      .status {
        min-height: 2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cellucid custom dataset examples</h1>
      <p>
        Three tiny, fully synthetic prepared datasets for learning the current
        Cellucid hosting contract. Nothing here is patient or experimental data.
      </p>
      <p>
        <a href="./exports/datasets.json">Open the exact catalog JSON</a>
        · <a href="./README.md">Read the complete setup guide</a>
      </p>
      <h2>Datasets</h2>
      <div id="status" class="status" role="status">Loading the catalog…</div>
      <ul id="datasets"></ul>
    </main>
    <script type="module">
      const status = document.getElementById('status');
      const list = document.getElementById('datasets');
      try {
        const response = await fetch('./exports/datasets.json', {
          cache: 'no-store'
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const catalog = await response.json();
        if (
          catalog === null ||
          typeof catalog !== 'object' ||
          Array.isArray(catalog) ||
          catalog.version !== 1 ||
          typeof catalog.default !== 'string' ||
          !Array.isArray(catalog.datasets) ||
          catalog.datasets.length !== 3
        ) {
          throw new Error('catalog version 1 contract is invalid');
        }
        for (const dataset of catalog.datasets) {
          const item = document.createElement('li');
          const identity = document.createElement('a');
          identity.href = `./exports/${dataset.path}dataset_identity.json`;
          identity.textContent = dataset.name;
          item.append(identity);
          item.append(
            ` — ${dataset.n_cells} cells, ${dataset.n_genes} genes` +
            (dataset.id === catalog.default ? ' (default)' : '')
          );
          list.append(item);
        }
        status.textContent = 'Catalog validated and loaded.';
      } catch (error) {
        status.textContent = `Catalog load failed: ${
          error instanceof Error ? error.message : 'unknown error'
        }`;
      }
    </script>
  </body>
</html>
