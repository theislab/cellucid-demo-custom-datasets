name: Dataset contracts

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Validate every committed artifact
        run: python scripts/validate_exports.py

      - name: Run adversarial contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  node-contract:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "26"]
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Validate browser-facing catalog bytes
        run: node --test tests/catalog-contract.test.mjs

  reproducibility:
    name: Byte-identical clean rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the exact build environment
        run: python -m pip install --requirement requirements-build.txt

      - name: Run Ruff static checks
        run: python -m ruff check scripts tests

      - name: Verify Ruff formatting
        run: python -m ruff format --check scripts tests

      - name: Compare every committed byte with a clean rebuild
        run: python scripts/build_datasets.py --check
